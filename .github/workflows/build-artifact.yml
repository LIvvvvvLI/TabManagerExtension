name: Build Extension Artifact

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release with the extension'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build VSIX Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
      vsix: ${{ steps.artifact.outputs.vsix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Extension: $NAME v$VERSION"

      - name: Compile and package extension on server
        run: npm run package

      - name: Rename VSIX with version
        id: artifact
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          NEW_NAME="${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.vsix"
          if [ "$VSIX_FILE" != "$NEW_NAME" ]; then
            mv "$VSIX_FILE" "$NEW_NAME"
          fi
          echo "vsix=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Final package: $NEW_NAME"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab-manager-extension
          path: '${{ steps.artifact.outputs.vsix }}'
          retention-days: 30
          compression-level: 0

      - name: Generate build summary
        run: |
          VSIX_FILE="${{ steps.artifact.outputs.vsix }}"
          FILE_SIZE=$(du -h "$VSIX_FILE" | cut -f1)
          
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Extension | ${{ steps.version.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | v${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| File | $VSIX_FILE |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $FILE_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | 20.x |" >> $GITHUB_STEP_SUMMARY
          echo "| Draft release | ${{ inputs.create_release }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll to the **Artifacts** section at the bottom of this page" >> $GITHUB_STEP_SUMMARY
          echo "2. Click on **tab-manager-extension** to download the ZIP file" >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the .vsix file from the ZIP" >> $GITHUB_STEP_SUMMARY
          echo "4. In VSCode, press Ctrl/Cmd + Shift + P" >> $GITHUB_STEP_SUMMARY
          echo "5. Type **Install from VSIX** and select the command" >> $GITHUB_STEP_SUMMARY
          echo "6. Choose the downloaded .vsix file" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Install via Command Line" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "code --install-extension $VSIX_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Draft Release
    needs: build
    if: inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@v4
        with:
          name: tab-manager-extension
          path: release-artifact

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            "release-artifact/${{ needs.build.outputs.vsix }}" \
            --draft \
            --title "${{ needs.build.outputs.name }} v${{ needs.build.outputs.version }}" \
            --generate-notes
